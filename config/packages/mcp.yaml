mcp:
  # Abilita i trasporti esposti dal server MCP
  client_transports:
    http: true
    stdio: false

  # Configurazione del trasporto HTTP
  http:
    path: "/_mcp"
    session:
      store: "file"                # 'file' o 'memory' (default: file)
      directory: "%kernel.cache_dir%/mcp-sessions" # default
      ttl: 3600                     # secondi
